name: Python

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Já estava configurado a branch de produção

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

      - name: Executar testes
        run: pytest -v

      - name: Construir imagem
        run: docker build -t app:1.0 .

      - name: Subir container
        run: docker run -d --name app app:1.0